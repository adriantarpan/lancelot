<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fdf3ea">
  <title>Lancelot.club · prototipo</title>

  <!-- App instalable (PWA): manifest, iconos (exportados del "APP ICON" de Figma) y modo pantalla completa en iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=3">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lancelot">
  <meta name="format-detection" content="telephone=no">

  <!-- Estilos: tokens (colores/fuentes) → base (marco, tipografía, botones) → componentes -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/envelope.css">
</head>
<body>
  <!--
    #device  = marco de teléfono (solo en escritorio).
    #stage   = lienzo de la app a tamaño Figma (402×874). js/core/fit.js lo escala.
    #app     = aquí el router pinta la pantalla activa.
  -->
  <div id="device" class="device">
    <div id="stage" class="stage">
      <main id="app" class="app" aria-live="polite"></main>
      <!-- Botón oculto de reset: triple toque en la esquina superior izquierda (o Shift+R) -->
      <button id="reset-hotspot" class="reset-hotspot" aria-label="Resetear prototipo"></button>
    </div>
  </div>

  <!-- GSAP + Draggable (animaciones e interacción). Versiones fijadas. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
